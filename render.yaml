services:
  - type: web
    name: audit-budget-analytics
    runtime: python
    autoDeploy: false
    buildCommand: "pip install -r system/requirements.txt && cd system && python manage.py collectstatic --noinput"
    preDeployCommand: "cd system && DJANGO_SETTINGS_MODULE=config.settings.production DJANGO_ENV=production DJANGO_USE_MIGRATION_DATABASE=true python manage.py migrate --noinput"
    startCommand: "cd system && DJANGO_SETTINGS_MODULE=config.settings.production DJANGO_ENV=production gunicorn config.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers 2"
    healthCheckPath: /health/live/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.2
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_READINESS_TOKEN
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: DJANGO_ALLOW_SYNTHETIC_DATASET
        value: "false"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "0"
      - key: DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "false"
      - key: DJANGO_SECURE_HSTS_PRELOAD
        value: "false"
